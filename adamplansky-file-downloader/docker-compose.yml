version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adamplansky-file-downloader_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/adamplansky/umbrel-apps:latest
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /home/umbrel/umbrel/home/Downloads/movies:/downloads
    environment:
      - TZ=${TZ}
      - WEBSHARE_USERNAME=${WEBSHARE_USERNAME:-}
      - WEBSHARE_PASSWORD=${WEBSHARE_PASSWORD:-}
      - WEBSHARE_WST=${WEBSHARE_WST:-}
